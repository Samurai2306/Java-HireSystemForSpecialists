spring:
  application:
    name: hr-system
  config:
    import: optional:file:.env[.properties]
  main:
    banner-mode: console
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hr_system_db}
    username: ${DB_USER:${DB_USERNAME:hr_user}}
    password: ${DB_PASSWORD:hr_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        show_sql: false
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

hr:
  scraper:
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
    connect-timeout-ms: 10000
    read-timeout-ms: 10000
    request-delay-ms: 500
    max-pages: 5
    max-retries: 3

logging:
  level:
    root: WARN
    com.hrsystem: INFO
    org.flywaydb: WARN
    org.hibernate: WARN
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF
    com.zaxxer.hikari: WARN
